{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1 class="h1">Blog</h1>
  <p class="p">Posts técnicos e guias de certificações. (SEO + AdSense-friendly)</p>

  <div class="hr"></div>

  <div class="grid">
    {% for p in posts %}
      <a class="card" href="{{ url_for('main.post', slug=p.slug) }}">
        <h2 class="h2">{{ p.title }}</h2>
        <p class="p">{{ p.description }}</p>
        <small class="muted">Ler post →</small>
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
